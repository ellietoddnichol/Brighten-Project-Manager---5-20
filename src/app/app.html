@if (!authLoaded()) {
  <div class="flex h-screen items-center justify-center bg-slate-100 text-slate-500 font-sans">
    Loading...
  </div>
} @else if (!user()) {
  <div class="flex h-screen items-center justify-center bg-slate-100 font-sans">
    <div class="bg-white p-8 rounded-xl shadow-md border border-slate-200 text-center max-w-sm w-full mx-4">
      <div class="w-12 h-12 bg-blue-600 rounded-lg flex items-center justify-center font-bold text-xl text-white shadow-sm mx-auto mb-4">B</div>
      <h1 class="text-2xl font-bold text-slate-900 mb-2">Brighten Project Manager</h1>
      <p class="text-sm text-slate-500 mb-4">Sign in to review jobs, money, documents, and source health.</p>

      @if (authService.loginError(); as err) {
        <div class="mb-4 rounded-lg border border-rose-200 bg-rose-50 px-3 py-2 text-left text-xs text-rose-800">
          {{ err }}
        </div>
      }

      <button type="button" (click)="login()" [disabled]="authService.signingIn()"
              class="w-full bg-slate-950 text-white px-4 py-3 rounded-lg font-medium hover:bg-slate-900 transition-colors flex items-center justify-center gap-3 disabled:opacity-60">
        <svg viewBox="0 0 24 24" class="w-5 h-5 fill-current"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/><path d="M1 1h22v22H1z" fill="none"/></svg>
        {{ authService.signingIn() ? 'Signing in…' : 'Sign in with Google' }}
      </button>
    </div>
  </div>
} @else {
  <app-shell [user]="user()" [today]="today" (logout)="logout()" />
}
