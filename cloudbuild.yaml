# Cloud Run continuous deploy (Dockerfile at repo root).
# Required when the trigger uses a custom service account:
# https://cloud.google.com/build/docs/securing-builds/configure-user-specified-service-accounts
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - '--no-cache'
      - '-t'
      - >-
        $_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:$COMMIT_SHA
      - .
      - '-f'
      - Dockerfile
    id: Build

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - >-
        $_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:$COMMIT_SHA
    id: Push

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - $_SERVICE_NAME
      - '--platform=managed'
      - >-
        --image=$_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:$COMMIT_SHA
      - >-
        --labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID,gcb-trigger-id=$_TRIGGER_ID
      - '--region=$_DEPLOY_REGION'
      - >-
        --add-cloudsql-instances=$_CLOUD_SQL_INSTANCE
      - >-
        --update-env-vars=DB_SOCKET_PATH=/cloudsql/$_CLOUD_SQL_INSTANCE,DB_NAME=$_DB_NAME,DB_USER=$_DB_USER,CORS_ORIGIN=$_CORS_ORIGIN,APP_STATIC_DIR=/app/public,FIREBASE_PROJECT_ID=brighten-project-manager,API_AUTH_REQUIRED=true
      - '--remove-env-vars=DB_PASSWORD'
      - >-
        --update-secrets=DB_PASSWORD=$_DB_PASSWORD_SECRET:latest
      - '--quiet'
    id: Deploy

images:
  - >-
    $_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:$COMMIT_SHA

options:
  substitutionOption: ALLOW_LOOSE
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _AR_HOSTNAME: europe-west1-docker.pkg.dev
  _AR_REPOSITORY: cloud-run-source-deploy
  _DEPLOY_REGION: europe-west1
  _PLATFORM: managed
  _SERVICE_NAME: projectmanager06
  _CLOUD_SQL_INSTANCE: project-manager-498120:us-central1:databaseprojectmgmt63
  _DB_NAME: brighten_pm
  _DB_USER: databaseprojectmgmt6
  # Secret Manager secret id (not the password). Create once — see docs/sql-api-integration.md
  _DB_PASSWORD_SECRET: brighten-pm-db-password
  # Set to your live Cloud Run URL (override in the Cloud Build trigger if needed)
  _CORS_ORIGIN: https://projectmanager06-810681729268.europe-west1.run.app,https://projectmanager06-zzehjpfjea-ew.a.run.app
  _TRIGGER_ID: 09726dad-508a-4cc1-806f-4998a223f618
